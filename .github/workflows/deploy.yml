name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # - name: Run linter
      #   run: npm run lint

      - name: Build production assets
        run: npm run build

      - name: Create deployment directory
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.VPS_HOST }}
          port: 10114
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p ${{ secrets.VPS_DEPLOY_PATH }}
            chmod 755 ${{ secrets.VPS_DEPLOY_PATH }}
            rm -rf ${{ secrets.VPS_DEPLOY_PATH }}/*

      - name: Deploy to VPS via SCP
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: 10114
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/*"
          target: ${{ secrets.VPS_DEPLOY_PATH }}
          strip_components: 1
          overwrite: true

      - name: Health check
        run: |
          sleep 5
          HTTP_CODE=$(curl -o /dev/null -s -w "%{http_code}\n" http://${{ secrets.VPS_HOST }})
          if [ $HTTP_CODE -ne 200 ]; then
            echo "Deployment health check failed: HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Deployment successful: HTTP $HTTP_CODE"
