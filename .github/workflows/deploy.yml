name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        continue-on-error: true
        run: npm run test

      # - name: Run linter
      #   run: npm run lint

      - name: Build production assets
        run: npm run build

      - name: Create deployment directory
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.VPS_HOST }}
          port: 10114
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p ${{ secrets.VPS_DEPLOY_PATH }}
            chmod 755 ${{ secrets.VPS_DEPLOY_PATH }}
            rm -rf ${{ secrets.VPS_DEPLOY_PATH }}/*

      - name: Deploy to VPS via SCP
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: 10114
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/*"
          target: ${{ secrets.VPS_DEPLOY_PATH }}
          strip_components: 1
          overwrite: true

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.VPS_HOST }}
          port: 10114
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "Verifying deployment files..."

            # Check if deployment directory exists
            if [ ! -d "${{ secrets.VPS_DEPLOY_PATH }}" ]; then
              echo "❌ Deployment directory not found: ${{ secrets.VPS_DEPLOY_PATH }}"
              exit 1
            fi

            # Check if index.html exists (main entry point)
            if [ ! -f "${{ secrets.VPS_DEPLOY_PATH }}/index.html" ]; then
              echo "❌ index.html not found in deployment directory"
              exit 1
            fi

            # List deployed files for verification
            echo "✓ Deployment directory exists: ${{ secrets.VPS_DEPLOY_PATH }}"
            echo "✓ index.html found"
            echo ""
            echo "Deployed files:"
            ls -lh "${{ secrets.VPS_DEPLOY_PATH }}" | head -10

            # Check file count
            FILE_COUNT=$(find "${{ secrets.VPS_DEPLOY_PATH }}" -type f | wc -l)
            echo ""
            echo "Total files deployed: $FILE_COUNT"

            if [ "$FILE_COUNT" -lt 1 ]; then
              echo "❌ Deployment appears to be empty"
              exit 1
            fi

            echo "✓ Deployment verification successful!"
